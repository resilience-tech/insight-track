name: project-tenancy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project_tenancy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_compose_role.sql:/docker-entrypoint-initdb.d/002_compose_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_tenancy"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/project-tenancy-realm.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://app_login:app@postgres:5432/project_tenancy?sslmode=disable
      DATABASE_ROLE: app_runtime
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8081/realms/project-tenancy
      OIDC_AUDIENCE: project-tenancy-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/project-tenancy/protocol/openid-connect/certs
      INVITATION_BASE_URL: http://localhost:3000/invitations/accept
      INVITATION_DELIVERY: log
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
