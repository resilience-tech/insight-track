global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s

frontend http
    bind :8080
    http-request redirect scheme https code 308

frontend https
    bind :8443 ssl crt /usr/local/etc/haproxy/certs alpn h2,http/1.1 ssl-min-ver TLSv1.2

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    acl proxy_health path -i /_proxy/health
    http-request return status 200 content-type text/plain string "ok\n" if proxy_health

    acl control_root path -i /api/control
    acl control_api path_beg -i /api/control/
    acl telemetry_root path -i /api/telemetry
    acl telemetry_api path_beg -i /api/telemetry/
    acl keycloak_root path -i /auth
    acl keycloak_path path_beg -i /auth/

    http-request redirect code 308 location /api/control/ if control_root
    http-request redirect code 308 location /api/telemetry/ if telemetry_root

    use_backend control_api if control_api
    use_backend telemetry_api if telemetry_api
    use_backend keycloak if keycloak_root or keycloak_path
    default_backend frontend

backend frontend
    option httpchk GET /healthz
    http-check expect status 200
    server frontend frontend:8080 check resolvers docker init-addr libc,none

backend keycloak
    server keycloak keycloak:8080 check resolvers docker init-addr libc,none

backend control_api
    http-request replace-path ^/api/control/(.*)$ /\1
    option httpchk GET /health/ready
    http-check expect status 200
    server tenancy-api tenancy-api:8080 check resolvers docker init-addr libc,none

backend telemetry_api
    http-request replace-path ^/api/telemetry/(.*)$ /\1
    option httpchk GET /health/ready
    http-check expect status 200
    server telemetry-api telemetry-api:8080 check resolvers docker init-addr libc,none
